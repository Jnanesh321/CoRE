<body>
  <script>
    // Apply saved theme early to avoid flash and pick the matching favicon
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) {
          var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          t = mq ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
        // Remove the favicon link that doesn't match to avoid duplicate icons in some browsers
        var favLight = document.getElementById('favicon-light');
        var favDark = document.getElementById('favicon-dark');
        if (t === 'dark' && favLight) favLight.remove();
        if (t === 'light' && favDark) favDark.remove();
      } catch (e) { }
    })();
  </script>
